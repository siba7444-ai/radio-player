<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Радио</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: #E8E6E1;
    color: #222;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px 16px;
  }

  .radio-panel {
    background: linear-gradient(135deg, #D4855A 0%, #C45C3A 100%);
    border-radius: 20px;
    padding: 28px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 32px rgba(196,92,58,0.35), inset 0 1px 0 rgba(255,255,255,0.08);
    color: #fff;
    width: 100%;
    max-width: 520px;
    min-height: 600px;
  }
  .radio-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .radio-header h2 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.3px;
    color: #fff;
  }
  .live-badge {
    display: none;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #ff4444;
    background: rgba(255,68,68,0.12);
    padding: 3px 8px;
    border-radius: 20px;
  }
  .live-dot {
    width: 6px; height: 6px;
    background: #ff4444;
    border-radius: 50%;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }
  .search-box { position: relative; margin-bottom: 14px; }
  .search-box input {
    width: 100%;
    padding: 10px 12px 10px 36px;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 12px;
    background: rgba(0,0,0,0.15);
    color: #fff;
    font-size: 14px;
    outline: none;
    transition: all 0.2s ease;
  }
  .search-box input:focus { border-color: rgba(255,255,255,0.5); background: rgba(0,0,0,0.25); }
  .search-box input::placeholder { color: rgba(255,255,255,0.5); }
  .search-icon {
    position: absolute;
    left: 10px; top: 50%;
    transform: translateY(-50%);
    color: rgba(255,255,255,0.6);
    pointer-events: none;
  }
  .category-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .category-tabs::-webkit-scrollbar { display: none; }
  .cat-btn {
    padding: 6px 14px;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 20px;
    background: transparent;
    color: rgba(255,255,255,0.8);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
  }
  .cat-btn:hover { border-color: #fff; color: #fff; background: rgba(255,255,255,0.1); }
  .cat-btn.active { background: #fff; color: #C45C3A; border-color: #fff; font-weight: 600; }
  .station-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 340px;
    overflow-y: auto;
    margin-bottom: 16px;
  }
  .station-list::-webkit-scrollbar { width: 4px; }
  .station-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 4px; }
  .station-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
    background: rgba(0,0,0,0.1);
  }
  .station-item:hover { background: rgba(0,0,0,0.2); border-color: rgba(255,255,255,0.15); }
  .station-item.active { background: rgba(0,0,0,0.25); border-color: rgba(255,255,255,0.4); }
  .station-item.playing {
    background: rgba(34,197,94,0.15);
    border-color: rgba(34,197,94,0.5);
  }
  .station-item.loading {
    border-color: rgba(234,179,8,0.5);
    background: rgba(234,179,8,0.1);
  }
  .station-item.error {
    border-color: rgba(239,68,68,0.4);
    background: rgba(239,68,68,0.1);
  }
  .station-icon {
    width: 34px; height: 34px;
    border-radius: 8px;
    background: rgba(255,255,255,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: rgba(255,255,255,0.7);
  }
  .station-item.active .station-icon,
  .station-item.playing .station-icon {
    color: #fff;
    background: rgba(255,255,255,0.3);
  }
  .station-info { flex: 1; min-width: 0; }
  .station-name {
    font-size: 14px;
    font-weight: 500;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .station-meta {
    font-size: 11px;
    color: rgba(255,255,255,0.6);
    margin-top: 2px;
  }
  .station-status {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .eq-bars {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 14px;
  }
  .eq-bar {
    width: 3px;
    background: #4ade80;
    border-radius: 1px;
    animation: eq 0.6s ease-in-out infinite alternate;
  }
  .eq-bar:nth-child(1) { height: 4px; animation-delay: 0s; }
  .eq-bar:nth-child(2) { height: 8px; animation-delay: 0.15s; }
  .eq-bar:nth-child(3) { height: 6px; animation-delay: 0.3s; }
  .eq-bar:nth-child(4) { height: 10px; animation-delay: 0.1s; }
  @keyframes eq {
    0% { height: 3px; }
    100% { height: 12px; }
  }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.2);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .player-panel {
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    padding: 16px;
    background: rgba(0,0,0,0.15);
    margin-top: auto;
  }
  .now-playing {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .np-cover {
    width: 46px; height: 46px;
    border-radius: 10px;
    background: rgba(255,255,255,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.7);
    flex-shrink: 0;
  }
  .np-info { flex: 1; min-width: 0; }
  .np-station {
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .np-track {
    font-size: 13px;
    color: rgba(255,255,255,0.75);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-height: 18px;
  }
  .np-status {
    font-size: 12px;
    color: rgba(255,255,255,0.55);
    margin-top: 2px;
  }
  .controls-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-bottom: 14px;
  }
  .ctrl-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.3);
    background: transparent;
    color: rgba(255,255,255,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .ctrl-btn:hover {
    border-color: #fff;
    color: #fff;
    background: rgba(255,255,255,0.15);
  }
  .ctrl-btn.primary {
    width: 52px; height: 52px;
    background: #fff;
    color: #C45C3A;
    border: none;
  }
  .ctrl-btn.primary:hover { opacity: 0.9; }
  .volume-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .volume-slider {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.25);
    outline: none;
  }
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
  }
  .volume-slider::-moz-range-thumb {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    border: none;
  }
  .vol-icon-btn {
    background: none;
    border: none;
    color: rgba(255,255,255,0.7);
    cursor: pointer;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .vol-icon-btn:hover { color: #fff; }
  .empty-state {
    text-align: center;
    padding: 32px 12px;
    color: rgba(255,255,255,0.5);
    font-size: 13px;
  }
  .fav-btn {
    background: none;
    border: none;
    color: rgba(255,255,255,0.4);
    cursor: pointer;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
  }
  .fav-btn:hover { color: rgba(255,255,255,0.7); }
  .fav-btn.is-fav { color: #ff6b6b; }
</style>

  const liveBadge = document.getElementById('live-badge');
  const catTabs = document.getElementById('category-tabs');
  try {
    const saved = localStorage.getItem('radio_favorites_v2');
    if (saved) favorites = new Set(JSON.parse(saved));
  } catch(e) {}
  function saveFavorites() {
    try { localStorage.setItem('radio_favorites_v2', JSON.stringify(Array.from(favorites))); } catch(e) {}
  }
  function getFilteredStations() {
    const q = searchInput.value.toLowerCase().trim();
    return stations.filter(function(s) {
      const ms = !q || s.name.toLowerCase().includes(q) || s.genre.toLowerCase().includes(q) || s.country.toLowerCase().includes(q);
      const mc = currentCat === 'all' || (currentCat === 'favorites' ? favorites.has(s.id) : s.cat === currentCat);
      return ms && mc;
    });
  }
  function renderStations() {
    const filtered = getFilteredStations();
    stationList.innerHTML = '';
    if (!filtered.length) { stationList.innerHTML = '<div class="empty-state">Станции не найдены</div>'; return; }
    filtered.forEach(function(s) {
      const isActive = currentStation && currentStation.id === s.id;
      const isFav = favorites.has(s.id);
      let cls = '';
      if (isActive && isPlaying) cls = ' playing';
      else if (isActive && isLoading) cls = ' loading';
      else if (isActive && !isPlaying && !isLoading) cls = ' error';
      else if (isActive) cls = ' active';
      const div = document.createElement('div');
      div.className = 'station-item' + cls;
      div.innerHTML = '<div class="station-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M8 12.1c.5 0 .9.4.9.9v5c0 1.6-1.3 2.9-2.9 2.9S3.1 19.6 3.1 18c0-1.6 1.3-2.9 2.9-2.9.4 0 .8.1 1.1.2v-2.3c0-.5.4-.9.9-.9zm-2 4.8c-.6 0-1.1.5-1.1 1.1s.5 1.1 1.1 1.1 1.1-.5 1.1-1.1-.5-1.1-1.1-1.1z" fill="currentColor"/><path fill-rule="evenodd" clip-rule="evenodd" d="M18.6 3.4c1.2-.2 2.3.7 2.3 1.9v10.7c0 1.6-1.3 2.9-2.9 2.9s-2.9-1.3-2.9-2.9c0-1.6 1.3-2.9 2.9-2.9.4 0 .8.1 1.1.2V9.2c0-.1-.1-.1-.1-.1l-6.3 1.3c-.5.1-.9-.2-1-.7-.1-.5.2-.9.7-1l6.3-1.3c.2 0 .3 0 .5 0V5.2c0-.1-.1-.1-.1-.1l-6.3 1.3c-.5.1-.9-.2-1-.7-.1-.5.2-.9.7-1l6.3-1.3zm-.6 11.5c-.6 0-1.1.5-1.1 1.1s.5 1.1 1.1 1.1 1.1-.5 1.1-1.1-.5-1.1-1.1-1.1z" fill="currentColor"/><path d="M7.3 5.4c.3-.5 1-.5 1.4 0l.1.1.1.5.1.2c.2.4.6.8 1.1 1l.4.2c.6.2.7 1.1.1 1.4l-.1 0-.5.2c-.4.2-.8.5-1 .9l-.1.2-.2.4c-.2.6-1.1.7-1.4.1l0-.1-.2-.4c-.2-.5-.5-.8-.9-1l-.2-.1-.4-.2c-.7-.2-.7-1.2 0-1.4l.4-.2.2-.1c.4-.2.8-.6 1-.9l.2-.4.1-.5z" fill="currentColor"/></svg></div><div class="station-info"><div class="station-name">' + s.name + '</div><div class="station-meta">' + s.genre + ' &middot; ' + s.country + '</div></div><div class="station-status">' + (isActive && isLoading ? '<div class="spinner"></div>' : '') + (isActive && isPlaying ? '<div class="eq-bars"><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div></div>' : '') + '<button class="fav-btn ' + (isFav ? 'is-fav' : '') + '" data-id="' + s.id + '" aria-label="Избранное"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 4.5C12 4.5 13.5 2 16 2C19.5 2 21 5 21 7C21 11 15 15 12 20.5C9 15 3 11 3 7C3 5 4.5 2 8 2C10.5 2 12 4.5 12 4.5Z" fill="' + (isFav ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button></div>';
      div.addEventListener('click', function(e) {
        if (e.target.closest('.fav-btn')) { e.stopPropagation(); toggleFavorite(s.id); return; }
        selectStation(s);
      });
      stationList.appendChild(div);
    });
  }
  function toggleFavorite(id) {
    favorites.has(id) ? favorites.delete(id) : favorites.add(id);
    saveFavorites(); renderStations();
  }
  function selectStation(s) {
    if (loadTimeout) clearTimeout(loadTimeout);
    stopNowPlaying();
    currentStation = s; currentUrlIndex = 0;
    isLoading = false; isPlaying = false;
    npStation.textContent = s.name;
    npTrack.textContent = '';
    npStatus.textContent = 'Загрузка...';
    audio.src = s.urls[0];
    audio.volume = volume;
    renderStations();
  }
  function tryNextUrl() {
    if (!currentStation) return;
    currentUrlIndex++;
    if (currentUrlIndex < currentStation.urls.length) {
      npStatus.textContent = 'Пробуем резервный сервер...';
      audio.src = currentStation.urls[currentUrlIndex];
      audio.load(); audio.play().catch(function(){});
    } else {
      isLoading = false; isPlaying = false;
      npStatus.textContent = 'Поток недоступен. Попробуйте позже.';
      liveBadge.style.display = 'none';
      updatePlayIcon(); renderStations();
    }
  }
  function playAudio() {
    if (!currentStation) return;
    isLoading = true; npStatus.textContent = 'Подключение...'; renderStations();
    audio.volume = volume; audio.muted = isMuted;
    if (loadTimeout) clearTimeout(loadTimeout);
    loadTimeout = setTimeout(function() { if (isLoading) tryNextUrl(); }, 8000);
    audio.play().catch(function() { isLoading = false; npStatus.textContent = 'Ошибка воспроизведения'; updatePlayIcon(); renderStations(); });
  }
  function pauseAudio() {
    if (loadTimeout) clearTimeout(loadTimeout);
    audio.pause(); isPlaying = false; isLoading = false;
    liveBadge.style.display = 'none';
    if (currentStation) npStatus.textContent = 'Пауза';
    updatePlayIcon(); renderStations();
  }
  function togglePlay() {
    if (!currentStation) {
      const f = getFilteredStations();
      if (f.length) { selectStation(f[0]); setTimeout(playAudio, 300); }
      return;
    }
    isPlaying ? pauseAudio() : playAudio();
  }
  function updatePlayIcon() {
    if (isPlaying) { iconPlay.style.display = 'none'; iconPause.style.display = 'block'; }
    else { iconPlay.style.display = 'block'; iconPause.style.display = 'none'; }
  }
  function prevStation() {
    const f = getFilteredStations(); if (!f.length) return;
    let i = currentStation ? f.findIndex(function(s) { return s.id === currentStation.id; }) : 0;
    selectStation(f[(i - 1 + f.length) % f.length]); setTimeout(playAudio, 300);
  }
  function nextStation() {
    const f = getFilteredStations(); if (!f.length) return;
    let i = currentStation ? f.findIndex(function(s) { return s.id === currentStation.id; }) : -1;
    selectStation(f[(i + 1) % f.length]); setTimeout(playAudio, 300);
  }
  function stopNowPlaying() {
    if (nowPlayingInterval) { clearInterval(nowPlayingInterval); nowPlayingInterval = null; }
    npTrack.textContent = '';
  }
  async function fetchNowPlaying() {
    if (!currentStation || !currentStation.api) { npTrack.textContent = ''; return; }
    try {
      if (currentStation.api === 'rp') {
        const res = await fetch('https://api.radioparadise.com/api/now_playing?chan=' + currentStation.apiId);
        const data = await res.json();
        if (data && data.song) npTrack.textContent = data.artist + ' — ' + data.song;
      } else if (currentStation.api === 'somafm') {
        const res = await fetch('https://api.somafm.com/songs/' + currentStation.apiId + '.json');
        const data = await res.json();
        if (data && data.songs && data.songs.length) {
          const s = data.songs[0];
          npTrack.textContent = s.artist + ' — ' + s.title;
        }
      }
    } catch(e) { npTrack.textContent = ''; }
  }
  function startNowPlaying() {
    stopNowPlaying();
    fetchNowPlaying();
    nowPlayingInterval = setInterval(fetchNowPlaying, 20000);
  }
  audio.addEventListener('playing', function() {
    if (loadTimeout) clearTimeout(loadTimeout);
    isLoading = false; isPlaying = true; liveBadge.style.display = 'flex';
    if (currentStation) {
      npStatus.textContent = 'В эфире · ' + currentStation.genre;
      startNowPlaying();
    }
    updatePlayIcon(); renderStations();
  });
  audio.addEventListener('waiting', function() { isLoading = true; npStatus.textContent = 'Буферизация...'; renderStations(); });
  audio.addEventListener('error', function() { if (loadTimeout) clearTimeout(loadTimeout); tryNextUrl(); });
  audio.addEventListener('stalled', function() { if (isPlaying) npStatus.textContent = 'Потеря сигнала...'; });
  audio.addEventListener('ended', function() { isPlaying = false; isLoading = false; liveBadge.style.display = 'none'; stopNowPlaying(); updatePlayIcon(); renderStations(); });
  audio.addEventListener('pause', function() { if (!isPlaying) stopNowPlaying(); });
  document.getElementById('btn-play').addEventListener('click', togglePlay);
  document.getElementById('btn-prev').addEventListener('click', prevStation);
  document.getElementById('btn-next').addEventListener('click', nextStation);
  document.getElementById('btn-mute').addEventListener('click', function() {
    isMuted = !isMuted; audio.muted = isMuted;
    document.getElementById('icon-volon').style.display = isMuted ? 'none' : 'block';
    document.getElementById('icon-voloff').style.display = isMuted ? 'block' : 'none';
  });
  document.getElementById('volume-slider').addEventListener('input', function(e) {
    volume = e.target.value / 100; audio.volume = volume;
    if (volume > 0 && isMuted) { isMuted = false; audio.muted = false; document.getElementById('icon-volon').style.display = 'block'; document.getElementById('icon-voloff').style.display = 'none'; }
  });
  searchInput.addEventListener('input', renderStations);
  catTabs.addEventListener('click', function(e) {
    const btn = e.target.closest('.cat-btn'); if (!btn) return;
    document.querySelectorAll('.cat-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active'); currentCat = btn.dataset.cat; renderStations();
  });
  audio.volume = volume; renderStations();
})();
</script>
</body>
</html>
